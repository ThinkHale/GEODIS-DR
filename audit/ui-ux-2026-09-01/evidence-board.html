<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GEODIS UI/UX audit evidence</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#e8edf3;color:#10213d;font:14px Inter,Arial,sans-serif}
  .board{width:1600px;padding:28px}.board h1{font-size:24px;margin:0 0 8px}.board p{margin:0 0 22px;color:#586b84}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{background:white;border:1px solid #cfd8e4;border-radius:10px;padding:12px;box-shadow:0 4px 14px rgba(7,31,67,.08)}
  .card h2{font-size:14px;margin:0 0 10px}.card img{display:block;width:100%;height:470px;object-fit:contain;object-position:top center;background:#f4f6f9;border:1px solid #e1e6ed}
  .card.mobile img{height:700px}.grid.settings .card img{height:410px}
</style>
</head>
<body><div id="board"></div>
<script>
const groups={
  core:{title:'Core workforce views',subtitle:'Desktop · fixture-backed local capture',items:[['01-overview.png','Overview'],['02-tasks.png','Tasks'],['03-associates.png','Associates'],['04-associate-profile.png','Associate profile']]},
  operations:{title:'Operational workflows',subtitle:'Desktop · source health, exceptions, and payroll',items:[['05-on-premise.png','On-Premise'],['06-attendance.png','Attendance'],['07-time-off.png','Time Off'],['08-payroll-discrepancies.png','Payroll discrepancies'],['09-payroll-hours.png','Payroll hours']]},
  staffing:{title:'Staffing, reconciliation, and entry states',subtitle:'Desktop · staffing, crosscheck, modal, and sign-in',items:[['10-beeline-requests.png','Beeline Requests'],['11-assignment-reconciliation.png','Assignment Reconciliation'],['18-add-task-modal.png','Raise a task'],['19-sign-in.png','Sign in']]},
  settings:{title:'Settings panels',subtitle:'Desktop · all six role-appropriate tabs',items:[['12-settings-account.png','Account'],['13-settings-users.png','Users'],['14-settings-connections.png','Connections'],['15-settings-locations.png','Locations'],['16-settings-shifts.png','Shifts'],['17-settings-app.png','App settings']]},
  mobile:{title:'Mobile viewport evidence',subtitle:'390 × 844 · bottom navigation clips its second row',items:[['20-mobile-overview.png','Mobile Overview']]}
};
const key=new URLSearchParams(location.search).get('group')||'core'; const g=groups[key];
document.getElementById('board').innerHTML='<div class="board"><h1>'+g.title+'</h1><p>'+g.subtitle+'</p><div class="grid '+key+'">'+g.items.map(x=>'<div class="card '+(key==='mobile'?'mobile':'')+'"><h2>'+x[1]+'</h2><img src="'+x[0]+'" alt=""></div>').join('')+'</div></div>';
</script></body></html>
